# yaml-language-server: $schema=https://json.schemastore.org/github-workflow-schema.json
#
# Shadow Kernel CI - builds the miatoll (SM6150) kernel in TWO flavours and
# ships both as flashable AnyKernel3 zips:
#
#   ksu       KernelSU compiled in   -> for people who want root
#   rootless  KernelSU compiled out  -> for people who don't want root at all
#
# The build recipe is NOT duplicated here: each job installs the host
# dependencies and runs ./build.sh, so CI and your local CLI build can never
# drift apart (KSU=on/off is the only difference).
#
# Triggers
#   * push to any branch                   -> both variants + artifacts, no release
#   * push a tag (v*, *-release, Shadow-*) -> both variants + a GitHub Release
#   * pull request                         -> both variants compile-checked
#   * "Run workflow" button                -> all of the above, with options
#
# Get a build: open the run -> Artifacts, or the Release if one was published.

name: Build Shadow Kernel (miatoll)

run-name: "Shadow Kernel · ${{ github.ref_name }} · ${{ github.event_name }}"

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "Defconfig path, relative to arch/arm64/configs/"
        type: string
        required: false
        default: vendor/xiaomi/miatoll_defconfig
      build_target:
        description: "make target (empty = defconfig default: Image.gz + dtbs + dtbo.img)"
        type: string
        required: false
        default: ""
      modulesig:
        description: "Module signature policy - 'permissive' keeps your ROM's prebuilt .ko files loadable"
        type: choice
        required: false
        default: permissive
        options:
          - permissive
          - keep
      localversion:
        description: "Pin LOCALVERSION / uname -r to what your ROM reports (empty = -ShadowKernel[-rootless])"
        type: string
        required: false
        default: ""
      debug:
        description: "Debug build: KSU_DEBUG + earlycon (root flavour only)"
        type: choice
        required: false
        default: "off"
        options:
          - "off"
          - "on"
      variants:
        description: "Which flavours to build"
        type: choice
        required: false
        default: both
        options:
          - both
          - ksu
          - rootless
      release_mode:
        description: "Publish the flashable zips as a GitHub Release"
        type: choice
        required: false
        default: auto
        options:
          - auto
          - nightly
          - off
  push:
    branches:
      - "**"
    tags:
      - "v*"
      - "*-release"
      - "Shadow-*"
    paths-ignore:
      - "**.md"
      - "Documentation/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "Documentation/**"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ARCH: arm64
  DEVICE_NAME: miatoll
  # Same prebuilts ./build.sh clones on a fresh machine
  CLANG_REPO: https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-6443078
  GCC64_REPO: https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9
  GCC32_REPO: https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9

jobs:
  plan:
    name: Resolve build inputs
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      stamp: ${{ steps.stamp.outputs.stamp }}
      defconfig: ${{ steps.decide.outputs.defconfig }}
      build_target: ${{ steps.decide.outputs.build_target }}
      release_mode: ${{ steps.decide.outputs.release_mode }}
      matrix: ${{ steps.decide.outputs.matrix }}
      modulesig: ${{ steps.decide.outputs.modulesig }}
      localversion: ${{ steps.decide.outputs.localversion }}
      debug: ${{ steps.decide.outputs.debug }}
    steps:
      - name: Pick a shared build stamp
        id: stamp
        shell: bash
        run: echo "stamp=$(date -u +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"

      - name: Decide what to build
        id: decide
        shell: bash
        env:
          IN_DEFCONFIG: ${{ inputs.defconfig }}
          IN_TARGET: ${{ inputs.build_target }}
          IN_VARIANTS: ${{ inputs.variants }}
          IN_RELEASE: ${{ inputs.release_mode }}
          IN_MODSIG: ${{ inputs.modulesig }}
          IN_LOCALVERSION: ${{ inputs.localversion }}
          IN_DEBUG: ${{ inputs.debug }}
          STAMP: ${{ steps.stamp.outputs.stamp }}
        run: |
          set -euo pipefail
          echo "defconfig=${IN_DEFCONFIG:-vendor/xiaomi/miatoll_defconfig}" >> "$GITHUB_OUTPUT"
          echo "build_target=${IN_TARGET:-}" >> "$GITHUB_OUTPUT"

          # which flavours to build, as a GitHub Actions matrix
          ksu_job='{"variant":"ksu","ksu":"on","expect_ksu":"enabled","blurb":"KernelSU built in - root via the KernelSU Manager app"}'
          root_job='{"variant":"rootless","ksu":"off","expect_ksu":"disabled","blurb":"KernelSU compiled out - no root, nothing to manage"}'
          case "${IN_VARIANTS:-both}" in
            ksu)      matrix="[$ksu_job]" ;;
            rootless) matrix="[$root_job]" ;;
            *)        matrix="[$ksu_job,$root_job]" ;;
          esac
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

          # Module signature policy, optional vermagic pin and debug build.
          # YAML reads on/off/yes/no as booleans, so normalise here rather than
          # letting a "false" reach build.sh, which is strict on purpose.
          case "${IN_MODSIG:-permissive}" in
            keep) modulesig=keep ;;
            *)    modulesig=permissive ;;
          esac
          case "${IN_DEBUG:-off}" in
            on|true|yes|y|1) debug=on ;;
            *)               debug=off ;;
          esac
          # A pasted `uname -r` may carry quotes/backticks/$ - none of those may
          # survive into a shell string ("  042, ' 047, ` 140, $ 044, \ 134, ; 073
          lv="$(printf '%s' "${IN_LOCALVERSION:-}" | tr -d '\042\047\140\044\134\073\r\n')"
          lv="${lv#"${lv%%[![:space:]]*}"}"
          lv="${lv%"${lv##*[![:space:]]}"}"
          echo "modulesig=$modulesig" >> "$GITHUB_OUTPUT"
          echo "debug=$debug" >> "$GITHUB_OUTPUT"
          echo "localversion=$lv" >> "$GITHUB_OUTPUT"
          if [ -n "$lv" ]; then
            echo "note: LOCALVERSION pinned to '$lv'; uname -r will not distinguish the flavours"
          fi

          mode="${IN_RELEASE:-auto}"
          # GitHub's YAML parser treats off/no/false as booleans, so an `off`
          # choice can arrive here as the string "false". Normalise every
          # spelling of "do not publish" - the fail-safe direction is *no
          # release*, never an accidental one.
          case "$mode" in
            off|false|no|never|0) mode=off ;;
            nightly|tag|auto) ;;
            *) echo "[!] unknown release_mode '$mode' - treating as off" >&2; mode=off ;;
          esac
          if [[ "$mode" == "auto" ]]; then
            case "$GITHUB_REF" in
              refs/tags/*) mode=tag ;;
              *) mode=off ;;
            esac
          fi
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            mode=off
          fi
          echo "release_mode=$mode" >> "$GITHUB_OUTPUT"
          echo "stamp=$STAMP | variants=${IN_VARIANTS:-both} | release=$mode"

  build:
    name: ${{ matrix.variant }}
    needs: plan
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      KSU: ${{ matrix.ksu }}
      DEFCONFIG: ${{ needs.plan.outputs.defconfig }}
      KERNEL_TARGET: ${{ needs.plan.outputs.build_target }}
      TANGGAL: ${{ needs.plan.outputs.stamp }}
      # module ABI compatibility knobs (see build.sh header)
      MODSIG: ${{ needs.plan.outputs.modulesig }}
      ROM_LOCALVERSION: ${{ needs.plan.outputs.localversion }}
      DEBUG: ${{ needs.plan.outputs.debug }}
      # one build dir per flavour so both can be produced side by side
      OUT_DIR: out-${{ matrix.variant }}
      VARIANT: ${{ matrix.variant }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install host dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates ccache curl device-tree-compiler \
            file flex git libelf-dev libssl-dev make openssl perl python3 \
            python-is-python3 rsync unzip zip

      - name: Show build context
        shell: bash
        run: |
          set -euo pipefail
          echo "variant   : $VARIANT (KSU=$KSU)"
          echo "kernel    : $(make kernelversion)"
          echo "host      : $(gcc --version | head -1)"
          echo "make      : $(make --version | head -1 | awk '{print $NF}')"
          echo "cores/ram : $(nproc --all) cores / $(free -h | awk '/^Mem:/{print $2}') ram"
          df -h /home/runner | awk 'NR==2{print "disk free : "$4" on "$6}'

      - name: Compile kernel (clang + GCC 4.9 binutils)
        id: compile
        shell: bash
        timeout-minutes: 150
        run: |
          set -euo pipefail
          bash build.sh compile 2>&1 | tee build.log
          ./clang/bin/clang --version | head -1 || true

      - name: Package AnyKernel3 flashable zip
        id: package
        shell: bash
        run: |
          set -euo pipefail
          bash build.sh zupload 2>&1 | tee -a build.log

      - name: Verify the build output
        shell: bash
        env:
          MODSIG_IN: ${{ needs.plan.outputs.modulesig }}
          DEBUG_IN: ${{ needs.plan.outputs.debug }}
          LV_IN: ${{ needs.plan.outputs.localversion }}
        run: |
          set -euo pipefail
          img="$OUT_DIR/arch/$ARCH/boot/Image.gz"
          zip="Shadow-Kernel-${DEVICE_NAME}-${TANGGAL}-${VARIANT}.zip"

          for f in "$img" "$zip"; do
            if [[ ! -s "$f" ]]; then
              echo "::error::$f is missing or empty"
              ls -la .
              exit 1
            fi
          done

          # Image.gz has to be a real gzip stream of a sane size
          gzip -t "$img"
          echo "gzip -l   : $(gzip -l "$img" | tail -1)"
          size=$(stat -c %s "$img")
          if (( size < 10 * 1024 * 1024 || size > 128 * 1024 * 1024 )); then
            echo "::error::Image.gz size looks wrong ($size bytes)"
            exit 1
          fi

          # the flashable zip must carry the flasher, the art and the new kernel
          listing=$(unzip -Z1 "$zip")
          for need in anykernel.sh banner version Image.gz \
                      META-INF/com/google/android/update-binary \
                      tools/ak3-core.sh tools/busybox; do
            if ! grep -qxF "$need" <<< "$listing"; then
              echo "::error::$zip is missing $need"
              exit 1
            fi
          done

          # the whole point of the matrix: the variant switch must have landed
          if grep -q "^CONFIG_KSU=y$" "$OUT_DIR/.config"; then have=enabled; else have=disabled; fi
          if [[ "$have" != "${{ matrix.expect_ksu }}" ]]; then
            echo "::error::asked for KernelSU=${{ matrix.expect_ksu }} but the build is $have"
            exit 1
          fi
          # module compatibility: a rebuilt kernel that black-screens usually
          # died on refused modules, so assert the policy survived olddefconfig
          if grep -q '^CONFIG_MODULE_SIG_FORCE=y' "$OUT_DIR/.config"; then
            sigs=enforced
          else
            sigs=permissive
          fi
          if [[ "$MODSIG_IN" == "permissive" && "$sigs" == enforced ]]; then
            echo "::error::modulesig=permissive but the shipped config still forces module signatures"
            echo "   -> your ROM's /vendor/lib/modules would be refused and the phone would hang"
            exit 1
          fi
          if [[ "$DEBUG_IN" == "on" && "${{ matrix.expect_ksu }}" == "enabled" ]]; then
            grep -q '^CONFIG_KSU_DEBUG=y' "$OUT_DIR/.config" \
              || { echo "::error::debug=on but CONFIG_KSU_DEBUG is off"; exit 1; }
            grep -q '^CONFIG_CMDLINE=.*earlycon' "$OUT_DIR/.config" \
              || { echo "::error::debug=on but earlycon is not on the kernel cmdline"; exit 1; }
          fi

          krel="$(cat "$OUT_DIR/include/config/kernel.release")"
          if [[ -n "$LV_IN" ]]; then
            # pinned to match the ROM's module vermagic, so the flavour tag is
            # gone on purpose - check the pin instead of the tag
            if [[ "$krel" != "$LV_IN" ]]; then
              echo "::error::asked for uname -r '$LV_IN' but the build reports '$krel'"
              exit 1
            fi
          else
            case "$VARIANT" in
              rootless) [[ "$krel" == *rootless* ]] || { echo "::error::rootless build is not tagged in $krel"; exit 1; } ;;
              *) [[ "$krel" != *rootless* ]] || { echo "::error::ksu build carries the rootless tag"; exit 1; } ;;
            esac
          fi

          sha256sum "$img" "$zip" | tee SHA256SUMS
          echo "kernel    : $krel"
          echo "KernelSU  : $have"
          echo "Mod sigs  : $sigs (requested: $MODSIG_IN)"
          # plain `if`, not `[ -n ] && echo` - a false test as the last command
          # of a set -e step is an exit 1
          if [ -n "$LV_IN" ]; then echo "uname -r  : pinned to $LV_IN"; fi
          echo "sizes     : Image.gz $(du -h "$img" | cut -f1) | zip $(du -h "$zip" | cut -f1)"

      - name: Stage release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "Shadow-Kernel-${DEVICE_NAME}-${TANGGAL}-${VARIANT}.zip" dist/
          cp "$OUT_DIR/arch/$ARCH/boot/Image.gz" "dist/Image-${VARIANT}.gz"
          {
            echo "Shadow Kernel ${VARIANT} - $(cat "$OUT_DIR/include/config/kernel.release")"
            cat SHA256SUMS
          } > "dist/SHA256SUMS-${VARIANT}.txt"
          ls -la dist

      - name: Collect build metadata
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p meta
          cp "$OUT_DIR/.config" meta/config-${VARIANT}.used 2>/dev/null || true
          cp "$OUT_DIR/include/config/kernel.release" meta/kernel.release 2>/dev/null || true
          cp "$OUT_DIR/System.map" meta/System-${VARIANT}.map 2>/dev/null || true
          {
            echo "variant=$VARIANT"
            echo "ksu=$KSU"
            echo "commit=$GITHUB_SHA"
            echo "ref=$GITHUB_REF_NAME"
            echo "host=$(grep -m1 PRETTY_NAME /etc/os-release | cut -d'"' -f2)"
            echo "clang=$(./clang/bin/clang --version 2>/dev/null | head -1)"
            echo "as=$(./gcc64/bin/aarch64-linux-android-as --version 2>/dev/null | head -1)"
            echo "defconfig=$DEFCONFIG"
          } > meta/build-info.txt
          cat meta/build-info.txt

      - name: Upload flashable zip
        uses: actions/upload-artifact@v7
        with:
          name: Shadow-Kernel-${{ env.DEVICE_NAME }}-${{ needs.plan.outputs.stamp }}-${{ matrix.variant }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload build metadata
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-meta-${{ needs.plan.outputs.stamp }}-${{ matrix.variant }}
          path: |
            meta
            build.log
          if-no-files-found: warn
          compression-level: 9
          retention-days: 14

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          img="$OUT_DIR/arch/$ARCH/boot/Image.gz"
          zip="Shadow-Kernel-${DEVICE_NAME}-${TANGGAL}-${VARIANT}.zip"
          krel="$(cat meta/kernel.release 2>/dev/null || echo unknown)"
          clangv="$(./clang/bin/clang --version 2>/dev/null | head -1 | grep -oE 'clang version [0-9.]+' || echo unknown)"
          {
            echo "## Shadow Kernel · ${VARIANT}"
            echo
            echo "| item | value |"
            echo "| --- | --- |"
            echo "| flavour | ${{ matrix.blurb }} |"
            echo "| kernel | \`$krel\` |"
            echo "| defconfig | \`$DEFCONFIG\` |"
            echo "| clang | \`$clangv\` |"
            if [ -f "$OUT_DIR/.config" ]; then
              if grep -q '^CONFIG_MODULE_SIG_FORCE=y' "$OUT_DIR/.config"; then
                echo "| module signatures | **forced** (ROM .ko files may be refused) |"
              else
                echo "| module signatures | not forced - ROM .ko files load |"
              fi
            fi
            echo "| debug build | ${{ needs.plan.outputs.debug }} |"
            if [ -n "${{ needs.plan.outputs.localversion }}" ]; then
              echo "| uname -r pinned to | \`${{ needs.plan.outputs.localversion }}\` |"
            fi
            echo "| commit | \`${GITHUB_SHA:0:10}\` |"
            if [[ -s "$zip" ]]; then
              echo "| flashable zip | \`$(basename "$zip")\` ($(du -h "$zip" | cut -f1)) |"
              echo "| Image.gz | $(du -h "$img" | cut -f1) |"
            else
              echo "| result | no zip produced - see the log tail below |"
            fi
            if [[ "${{ job.status }}" != "success" && -f build.log ]]; then
              echo
              echo "### First errors"
              echo
              echo '```text'
              grep -nE "error:|Error [0-9]+|No rule to make target|Failed To Compile" build.log | head -30 || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish release
    needs: [plan, build]
    if: needs.plan.outputs.release_mode != 'off'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Download every flavour
        uses: actions/download-artifact@v8
        with:
          pattern: Shadow-Kernel-${{ env.DEVICE_NAME }}-${{ needs.plan.outputs.stamp }}-*
          path: staging
          merge-multiple: true

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          STAMP: ${{ needs.plan.outputs.stamp }}
          MODE: ${{ needs.plan.outputs.release_mode }}
        run: |
          set -euo pipefail
          cd staging
          mapfile -t assets < <(find . -maxdepth 1 -type f \( -name '*.zip' -o -name '*.gz' -o -name '*.txt' \) -printf '%P\n' | sort)
          zips=$(find . -maxdepth 1 -name 'Shadow-Kernel-*.zip' | wc -l)
          if (( zips == 0 )); then
            echo "::error::no flashable zips were staged"
            exit 1
          fi
          echo "attaching ${#assets[@]} files ($zips flashable zips)"

          tag="$GITHUB_REF_NAME"
          extra=""
          if [[ "$MODE" == "nightly" ]]; then
            tag="nightly"
            extra="--prerelease --target $GITHUB_SHA"
            # rolling tag: drop the old release so it follows this commit
            gh release delete "$tag" --cleanup-tag --yes 2>/dev/null || true
          fi

          {
            echo "Shadow Kernel for Xiaomi **miatoll** (Redmi Note 9 Pro / Pro Max / 9S, POCO M2 Pro)."
            echo
            echo "Built by Actions from \`${GITHUB_SHA:0:10}\` - stamp \`$STAMP\`."
            echo
            echo "## Pick one (do not flash both)"
            echo
            echo "| file | who it is for |"
            echo "| --- | --- |"
            echo "| \`Shadow-Kernel-miatoll-$STAMP-ksu.zip\` | you **want root**: KernelSU is built in, install the KernelSU Manager app |"
            echo "| \`Shadow-Kernel-miatoll-$STAMP-rootless.zip\` | you **do not want root**: KernelSU is compiled out entirely |"
            echo
            echo "Both are AnyKernel3 zips: they swap the kernel inside your existing"
            echo "boot image and reuse your device DTB, so recovery flash / sideload only."
            echo "Bootloader must be unlocked and verification disabled - these builds are"
            echo "not AVB signed, so a locked device would bootloop."
            echo
            echo "The flasher prints an ASCII Shadow Kernel banner plus your detected"
            echo "codename, model, ROM, Android level and lock state before it touches"
            echo "anything, and aborts on the wrong device or Android version."
            echo
            echo "## Module compatibility"
            echo
            echo "Every kernel build invents its own \`certs/signing_key.pem\`, so a rebuilt"
            echo "kernel can never hold the key your ROM signed \`/vendor/lib/modules\` with."
            echo "With \`CONFIG_MODULE_SIG_FORCE=y\` those modules get refused and the phone"
            echo "hangs on a black screen even though the kernel is fine - so these builds"
            echo "do not force module signatures (the CI job asserts it in the final .config)."
            if [[ -n "${{ needs.plan.outputs.localversion }}" ]]; then
              echo
              echo "\`uname -r\` is pinned to \`${{ needs.plan.outputs.localversion }}\` so the"
              echo "vermagic your ROM's modules were built against still matches."
            fi
            echo
            echo "## If it does not boot"
            echo
            echo "The last log survives in ramoops - from a recovery terminal:"
            echo
            echo '```'
            echo "cat /sys/fs/pstore/console-ramoops-0 > /sdcard/pstore.txt"
            echo "grep -iE 'vermagic|version of symbol|signature|not trusted|Unknown symbol|panic' /sdcard/pstore.txt"
            echo '```'
            echo
            echo "Undo with: \`fastboot flash boot <your boot-orig.img backup>\`."
            echo
            echo "## Checksums"
            echo
            echo '```'
            cat $(find . -maxdepth 1 -name 'SHA256SUMS-*.txt' | sort) 2>/dev/null || true
            echo '```'
            echo
            echo "[Build log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } > ../release-notes.md

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --title "Shadow Kernel $tag" \
              --notes-file ../release-notes.md \
              $extra
          fi

          # never report success on a release without the flashable zips on it
          attached="$(gh release view "$tag" --json assets --jq '[.assets[].name] | join(" ")')"
          echo "release assets: $attached"
          for f in "${assets[@]}"; do
            case " $attached " in
              *" $f "*) ;;
              *) echo "::error::$f was not attached to the release"; exit 1 ;;
            esac
          done
          echo "Published: ${{ github.server_url }}/${{ github.repository }}/releases/tag/$tag"
